; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; the sketch only needs to catch 2 incoming sync bytes and never transmits,
; so shrink HardwareSerial's default 64+64 byte buffers to the minimum --
; RAM on this board is already extremely tight (see OTA_IMPLEMENTATION_PLAN.md)
build_flags =
  -D SERIAL_RX_BUFFER_SIZE=16
  -D SERIAL_TX_BUFFER_SIZE=1

; Upload wirelessly over the HC-05's paired Bluetooth SPP COM port instead
; of USB. See HC05_BLUETOOTH_OTA_NOTES.md for the full technique. Fill in
; upload_port with the HC-05's *outgoing* COM port (Control Panel > Devices
; and Printers > Bluetooth Settings > COM Ports tab) after pairing it.
[env:uno_bluetooth]
extends = env:uno
upload_port = COM3
upload_speed = 115200

[platformio]
description = Arduino guitar pedal
