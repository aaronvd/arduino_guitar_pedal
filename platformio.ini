; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; the sketch only needs to catch 2 incoming sync bytes and never transmits,
; so shrink HardwareSerial's default 64+64 byte buffers to the minimum --
; RAM on this board is already extremely tight (see OTA_IMPLEMENTATION_PLAN.md)
;
; NOTE: with a 1-byte TX buffer, Serial.print() of more than a single byte
; hangs forever -- pedal sketches must never transmit (see HC05_BRINGUP.md)
build_flags =
  -D SERIAL_RX_BUFFER_SIZE=16
  -D SERIAL_TX_BUFFER_SIZE=1
; src/hc05_config.cpp is a separate one-time sketch, built only by
; env:hc05_config
build_src_filter = +<*> -<hc05_config.cpp>

; Upload wirelessly over the HC-05's Bluetooth serial port instead of USB.
; /dev/rfcomm0 is created by `sudo rfcomm bind 0 <HC-05 MAC> 1` after
; pairing -- see HC05_BRINGUP.md. Default env, so the PlatformIO toolbar's
; Upload button goes over Bluetooth. Uses scripts/bt_upload.py rather than
; avrdude, which proved unreliable over the Bluetooth link.
[env:uno_bluetooth]
extends = env:uno
upload_port = /dev/rfcomm0
upload_protocol = custom
upload_command = $PYTHONEXE scripts/bt_upload.py $UPLOAD_PORT $SOURCE

; One-time sketch that configures the HC-05 via AT commands using the
; existing wiring (see HC05_BRINGUP.md). Deliberately does NOT extend
; env:uno: it needs to transmit, so it keeps the default Serial buffers.
[env:hc05_config]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<hc05_config.cpp>

[platformio]
default_envs = uno_bluetooth
description = Arduino guitar pedal
